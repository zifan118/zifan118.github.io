<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Harborly – Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

  <style>
    :root {
      --bg-main: #ffffff;
      --text-main: #2f2648;
      --text-secondary: #7e73a8;
      --border-soft: #e2ddf5;
      --accent: #7f6af2;
      --accent-hover: #6551d6;
      --light-lilac: #f2edff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .auth-wrapper {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border: 1px solid var(--border-soft);
      border-radius: 1.5rem;
      padding: 2rem 2rem 2.5rem;
      box-shadow: 0 20px 45px rgba(50,35,95,0.15);
    }

    .auth-title {
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: .25rem;
    }

    .auth-subtitle {
      font-size: .9rem;
      color: var(--text-secondary);
      margin-bottom: 1.2rem;
    }

    .notice {
      background: #f2edff;
      border: 1px solid var(--border-soft);
      border-radius: 0.9rem;
      padding: 0.85rem 0.9rem;
      margin-bottom: 1.2rem;
      font-size: 0.85rem;
      line-height: 1.4;
      color: #372261;
    }

    .tab-switch {
      display: flex;
      gap: .5rem;
      background: var(--light-lilac);
      padding: .35rem;
      border-radius: 999px;
      margin-bottom: 1.7rem;
    }

    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      padding: .55rem .75rem;
      border-radius: 999px;
      font-size: .9rem;
      cursor: pointer;
      transition: 0.18s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
    }

    form { display: none; }
    form.active { display: block; }

    .form-group { margin-bottom: 1rem; }

    label {
      display: block;
      font-size: .85rem;
      margin-bottom: .3rem;
    }

    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%;
      padding: .6rem .75rem;
      border-radius: .6rem;
      border: 1px solid var(--border-soft);
      background: #faf8ff;
      color: var(--text-main);
      font-size: .9rem;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(127,106,242,0.3);
    }

    .btn-primary {
      width: 100%;
      padding: .7rem .75rem;
      border-radius: .75rem;
      border: none;
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
      font-size: .95rem;
      cursor: pointer;
      margin-bottom: .75rem;
      transition: 0.2s;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    .inline-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .8rem;
      margin-bottom: 1rem;
    }

    .inline-group a {
      color: var(--accent);
      text-decoration: none;
    }
    .inline-group a:hover { color: var(--accent-hover); }

    .secondary-link {
      font-size: .82rem;
      text-align: center;
      margin-top: 0.3rem;
    }
    .secondary-link a {
      color: var(--accent);
      text-decoration: none;
    }
    .secondary-link a:hover { color: var(--accent-hover); }

    .helper-text {
      font-size: .75rem;
      color: var(--text-secondary);
    }

    .error {
      font-size: .75rem;
      color: #d94848;
      margin-top: .25rem;
    }

    .captcha-wrap { margin: .75rem 0 1rem; }
  </style>
</head>

<body>
  <div class="auth-wrapper">
    <h1 class="auth-title">Harborly</h1>
    <p class="auth-subtitle">A calmer space to begin your journey.</p>

    
    <div class="tab-switch">
      <button id="loginTab" class="tab-btn active" type="button">Login</button>
      <button id="registerTab" class="tab-btn" type="button">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="active" method="post" action="#demo-login_process">
      <input type="hidden" name="redirect" value="home.php">

      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" name="email" id="loginEmail" value="" required>
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" name="password" id="loginPassword" required>
      </div>

      
    
      <button type="submit" class="btn-primary">Login</button>

      <p class="secondary-link">
        New here? <a href="#" id="switchToRegister">Create an account</a>
      </p>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" method="post" action="#demo-register_process">
      <div class="form-group">
        <label for="regName">Display name</label>
        <input type="text" name="name" id="regName" value="" required>
      </div>

      <div class="form-group">
        <label for="regEmail">Email</label>
        <input type="email" name="email" id="regEmail" value="" required>
        <p class="helper-text">We’ll use this email as your login account.</p>
      </div>

      <div class="form-group">
        <label for="regPassword">Password</label>
        <input type="password" name="password" id="regPassword" required>
        <p class="helper-text">At least 8 characters.</p>
      </div>

      <div class="form-group">
        <label for="regPassword2">Confirm password</label>
        <input type="password" name="password2" id="regPassword2" required>
      </div>

      
      <div class="captcha-wrap">
        <div class="g-recaptcha" data-sitekey="6Ld6xSwsAAAAAKiFAj3_0AhJHZCEKn5vrCHWynZ2"></div>
      </div>

      <button type="submit" class="btn-primary">Create account</button>

      <p class="secondary-link">
        Already have an account? <a href="#" id="switchToLogin">Back to login</a>
      </p>
    </form>
  </div>

  <script>
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const switchToRegister = document.getElementById('switchToRegister');
    const switchToLogin = document.getElementById('switchToLogin');

    function showLogin() {
      loginTab.classList.add('active');
      registerTab.classList.remove('active');
      loginForm.classList.add('active');
      registerForm.classList.remove('active');
      location.hash = '#login';
    }

    function showRegister() {
      registerTab.classList.add('active');
      loginTab.classList.remove('active');
      registerForm.classList.add('active');
      loginForm.classList.remove('active');
      location.hash = '#register';
    }

    loginTab.addEventListener('click', showLogin);
    registerTab.addEventListener('click', showRegister);

    if (switchToRegister) switchToRegister.addEventListener('click', (e) => { e.preventDefault(); showRegister(); });
    if (switchToLogin) switchToLogin.addEventListener('click', (e) => { e.preventDefault(); showLogin(); });

    // URL hash 决定初始 tab
    (function initTabFromHash(){
      const h = (location.hash || '').toLowerCase();
      if (h === '#register') showRegister();
      else showLogin();
    })();

    // 注册成功后自动切回 login
      </script>
<!-- Portfolio demo layer: replaces server-side PHP/MySQL actions so the static copy stays usable -->
<style>
#demo-bar{position:fixed;left:12px;bottom:12px;z-index:99999;background:#24172b;color:#f3efe9;font:500 12.5px/1.4 system-ui,sans-serif;padding:8px 12px;border-radius:99px;box-shadow:0 4px 16px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center}
#demo-bar a{color:#e8c86a;text-decoration:none}
#demo-toast{position:fixed;left:50%;bottom:64px;transform:translate(-50%,20px);opacity:0;z-index:99999;background:#24172b;color:#fff;font:14px/1.45 system-ui,sans-serif;padding:12px 18px;border-radius:12px;max-width:min(90vw,460px);text-align:center;transition:.3s;pointer-events:none}
#demo-toast.on{opacity:1;transform:translate(-50%,0)}
</style>
<div id="demo-bar">Static demo · sample content <a href="../">About this project →</a></div>
<div id="demo-toast" role="status"></div>
<script>
(function(){
  var toastEl=document.getElementById('demo-toast'),tm;
  function toast(m){toastEl.textContent=m;toastEl.classList.add('on');clearTimeout(tm);tm=setTimeout(function(){toastEl.classList.remove('on')},3200)}
  function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
  // likes
  var of=window.fetch;
  window.fetch=function(u,o){
    if(String(u).indexOf('#demo-like')===0){
      var id=new URLSearchParams((o&&o.body)||'').get('id'),likes=store('h_likes')||{};
      var btn=document.querySelector('[data-id="'+id+'"] .like-count, [data-story-id="'+id+'"] .like-count');
      var base=btn?parseInt(btn.textContent,10)||0:0, liked=!likes[id]; likes[id]=liked; store('h_likes',likes);
      return Promise.resolve(new Response(JSON.stringify({ok:true,liked:liked,count:liked?base+1:Math.max(0,base-1)}),{headers:{'Content-Type':'application/json'}}));
    }
    return of.apply(this,arguments);
  };
  // forms
  document.addEventListener('submit',function(e){
    var f=e.target,a=f.getAttribute('action')||'';
    if(f.id==='optionsForm'||f.id==='sessionForm') return; // client-side features already work
    if(a.indexOf('#demo-login_process')===0||a.indexOf('#demo-register_process')===0){e.preventDefault();toast('Demo: signed in as Demo User');setTimeout(function(){location.href='home.html'},900);return;}
    if((f.method||'get').toLowerCase()==='get'){
      e.preventDefault();
      var fd=new FormData(f),q=(fd.get('q')||'').toString().trim().toLowerCase(),tp=fd.getAll('topic[]').map(String),sort=fd.get('sort');
      var page=location.pathname.split('/').pop()||'index.html', base=page.indexOf('community')===0?'community':(page.indexOf('stories_index')===0?'stories_index':null);
      var target=base?(sort?base+'-sort-'+sort+'.html':base+'.html'):page;
      var h='#q='+encodeURIComponent(q)+'&t='+encodeURIComponent(tp.join('|'));
      if(target!==page){location.href=target+h}else{location.hash=h;filter()}
      return;
    }
    e.preventDefault();
    toast('This is a static copy of the site. Posting, commenting and sign-up ran on the original PHP/MySQL server, so nothing is saved here.');
  },true);
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href^="#demo-"]');
    if(a){e.preventDefault();toast('Static copy: this action needs the original PHP/MySQL server.');}
  },true);
  function filter(){
    var p=new URLSearchParams(location.hash.slice(1)),q=(p.get('q')||'').toLowerCase(),t=(p.get('t')||'').split('|').filter(Boolean);
    if(!q&&!t.length)return;
    var n=0;document.querySelectorAll('.card').forEach(function(c){var tx=c.textContent.toLowerCase();var ok=(!q||tx.indexOf(q)>-1)&&t.every(function(x){return tx.indexOf(x.toLowerCase())>-1});c.style.display=ok?'':'none';if(ok)n++});
    var qi=document.querySelector('input[name="q"]');if(qi)qi.value=p.get('q')||'';
    document.querySelectorAll('input[name="topic[]"]').forEach(function(i){i.checked=t.indexOf(i.value)>-1});
    toast(n+' matching post'+(n===1?'':'s'));
  }
  window.addEventListener('DOMContentLoaded',filter);if(document.readyState!=='loading')filter();
  // restore likes
  var likes=store('h_likes')||{};Object.keys(likes).forEach(function(id){if(!likes[id])return;document.querySelectorAll('[data-id="'+id+'"], [data-story-id="'+id+'"]').forEach(function(b){if(b.classList.contains('like-btn')&&!b.classList.contains('is-liked')){b.classList.add('is-liked');var h=b.querySelector('.heart');if(h)h.textContent='❤️';var c=b.querySelector('.like-count');if(c)c.textContent=(parseInt(c.textContent,10)||0)+1}})});
})();
</script>

</body>
</html>
