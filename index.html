<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zifan Zeng — Portfolio</title>
<meta name="description" content="Zifan Zeng — research and digital projects on platforms, algorithms, digital identity and invisible labour.">
<meta name="theme-color" content="#7a1e25">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;600;700&family=Cabin+Condensed:wght@600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one fixed 16:9 poster scene that covers the viewport (pans sideways on phones); UI pills float on top; content opens in poster-style sheets. */
:root{
  --maroon:#7a1e25; --maroon-deep:#5a1419; --cream:#f0e7d3; --ink:#2a2420; --ink-soft:#5d544b; --yellow:#e2c25e;
  --f-display:"Cabin Condensed","Gill Sans","Gill Sans MT",Calibri,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-body:"Cabin","Gill Sans","Gill Sans MT",Calibri,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#b9c3c6;color:var(--ink);font-family:var(--f-body);overflow:hidden}

/* ---------- scene palette (day / night) ---------- */
.scene{
  --sky1:#8c9dae; --sky2:#b9c3c6; --sky3:#e4dfcf;
  --cloud:#eee8d8; --cloud2:#d2d5cf;
  --fell-far:#8e9ca6; --fell-mid:#7d8b6a; --hill:#5f6e4b; --tree:#46573c; --tree2:#3a4934;
  --stone:#b89a6a; --stone-d:#8e7550; --stone-l:#d6c194; --roof:#6d5c58; --roof-d:#574843;
  --plat:#cfc7b6; --plat-edge:#e6dfcf; --ballast:#6a5c52; --rail:#aaa59c; --sleeper:#4a3f38;
  --fg:#d8d2c4; --fg-d:#bdb6a6; --glass:#3f4a52; --glass-l:#59656d; --lamp-glass:#e9e6dc;
  --coach-roof:#55504c; --steam:#f1ece0;
  --glow:0; --stars:0; --shadow-a:1;
}
.scene[data-mode="night"]{
  --sky1:#111829; --sky2:#222c46; --sky3:#4a4b5f;
  --cloud:#3a4258; --cloud2:#2c3348;
  --fell-far:#2d3649; --fell-mid:#263027; --hill:#1f2a20; --tree:#18211a; --tree2:#121a14;
  --stone:#5e5240; --stone-d:#463c2f; --stone-l:#6f614b; --roof:#2e2628; --roof-d:#231d1f;
  --plat:#5d5a55; --plat-edge:#6d6a64; --ballast:#2e2925; --rail:#77736c; --sleeper:#1f1a17;
  --fg:#68645d; --fg-d:#57534d; --glass:#f2c46b; --glass-l:#f7d892; --lamp-glass:#ffe1a0;
  --coach-roof:#2c2928; --steam:#8a8f9e;
  --glow:1; --stars:1; --shadow-a:.35;
}
body:has(.scene[data-mode="night"]){background:#111829}

/* ---------- stage ---------- */
.stage{position:fixed;inset:0;overflow:hidden}
.scene{position:absolute;left:50%;top:50%;width:max(100vw,177.78vh);height:max(56.25vw,100vh);transform:translate(-50%,-50%)}
.scene svg.world{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block}
.scene svg *{transition:fill .9s ease,opacity .9s ease}
.layer{will-change:transform}
#shadows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:multiply;
  opacity:var(--shadow-a);transition:opacity .9s;
  -webkit-mask-image:linear-gradient(to bottom,transparent 30%,#000 52%);mask-image:linear-gradient(to bottom,transparent 30%,#000 52%)}
.drift{animation:drift 150s linear infinite}
@keyframes drift{to{transform:translateX(-1600px)}}

@media (max-aspect-ratio:1/1){
  .stage{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .stage::-webkit-scrollbar{display:none}
  .scene{position:relative;left:0;top:0;transform:none;height:100%;width:calc(100dvh * 1.7778)}
}

/* ---------- hot spots (HTML over the SVG, sized in em = scene scale) ---------- */
.hots{position:absolute;inset:0;pointer-events:none}
.hot{position:absolute;pointer-events:auto;background:transparent;border:0;padding:0;cursor:pointer;border-radius:.3em}
.hot:focus-visible{outline:.15em solid var(--yellow);outline-offset:.2em}
.tag{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font:600 .78em/1 var(--f-body);letter-spacing:.06em;
  background:var(--cream);color:var(--maroon);padding:.38em .62em .32em;border-radius:.2em;box-shadow:0 .12em 0 rgba(0,0,0,.18);
  transition:transform .25s ease}
.tag b{font-family:var(--f-display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-left:.35em}
.hot:hover .tag,.hot:focus-visible .tag{transform:translateX(-50%) translateY(-.2em)}

/* departure board */
.board{position:absolute;left:7%;top:27.8%;width:28%;pointer-events:auto;
  background:#151515;border:.32em solid #2b2b2b;border-radius:.25em;box-shadow:0 .5em 0 rgba(0,0,0,.18);padding:.55em .7em .7em;color:#f3f1ea}
.board h2{margin:0 0 .45em;display:flex;justify-content:space-between;align-items:baseline;font:700 .95em/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--yellow)}
.board h2 span{font:500 .8em/1 var(--f-mono);color:#bdb9ad;letter-spacing:.04em}
.cols,.row{display:grid;grid-template-columns:auto 1fr auto;gap:.5em;align-items:center}
.cols{font:500 .62em/1 var(--f-mono);color:#8f8b82;letter-spacing:.12em;text-transform:uppercase;padding:0 .2em .45em}
.row{width:100%;background:transparent;border:0;color:inherit;padding:.18em .2em;cursor:pointer;border-radius:.2em;text-align:left}
.row:hover,.row:focus-visible{background:transparent;outline:none}
.c{transition:background .25s ease,color .25s ease}
.row:hover .c,.row:focus-visible .c{background:var(--cream);color:var(--ink)}
.row:hover .c::after,.row:focus-visible .c::after{background:rgba(42,36,32,.18)}
.row:hover .type .c,.row:focus-visible .type .c{background:var(--yellow);color:var(--ink)}
.row:focus-visible{box-shadow:0 0 0 .12em var(--yellow)}
.cells{display:flex;gap:.08em}
.c{display:inline-grid;place-items:center;width:.9em;height:1.25em;background:#232323;border-radius:.1em;position:relative;
  font:700 1.08em/1 var(--f-display);text-transform:uppercase;color:#f3f1ea}
.c::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#0b0b0b}
.c.flip{animation:flip .055s linear}
@keyframes flip{0%{transform:scaleY(.15)}100%{transform:scaleY(1)}}
.type .c{color:var(--yellow)}
.scene[data-mode="night"] .c{text-shadow:0 0 .35em rgba(255,230,170,.35)}

/* intro train + signal */
.hot{transition:opacity .4s ease}
.scene.intro .hot{opacity:0;pointer-events:none}
.sig-r{fill:#e0473d;transition:fill .3s}.sig-g{fill:#26382c;transition:fill .3s}
.scene.go .sig-r{fill:#4a1d1a}.scene.go .sig-g{fill:#5fe08a}
.sig-halo{opacity:0;transition:opacity .3s ease}.scene.go .sig-halo{opacity:1}
.puff{opacity:0;transform-box:fill-box;transform-origin:center}
.scene.leaving .puff{animation:puff 1.6s ease-out infinite}
.scene.leaving .puff:nth-child(2){animation-delay:.5s}.scene.leaving .puff:nth-child(3){animation-delay:1s}
@keyframes puff{0%{opacity:.85;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(30px,-60px) scale(1.6)}}

/* works drawer: stopping-pattern diagram */
.route{position:relative;list-style:none;margin:0;padding:0 0 0 60px}
.route::before{content:"";position:absolute;left:21px;top:30px;bottom:30px;width:6px;border-radius:3px;background:var(--maroon)}
.stop{position:relative;padding:14px 0 16px;cursor:default;scroll-margin-top:120px}
.stop+.stop{border-top:1px solid rgba(42,36,32,.14)}
.stop::before{content:"";position:absolute;left:-48px;top:22px;width:14px;height:14px;border-radius:50%;background:var(--cream);border:4px solid var(--maroon);box-sizing:content-box;transition:background .25s}
.stop:first-child::before,.stop:last-child::before{border-radius:4px;width:24px;height:10px;left:-53px;top:24px}
.stop.on::before{background:var(--yellow)}
.stop .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.stop h4{margin:0;font:700 24px/1.15 var(--f-display);letter-spacing:.02em;text-wrap:balance;transition:color .25s}
.stop.on h4{color:var(--maroon)}
.stop time{font:500 13px/1 var(--f-mono);color:var(--ink-soft);font-variant-numeric:tabular-nums;flex:none}
.stop .meta{font:500 12px/1.4 var(--f-mono);color:var(--maroon);letter-spacing:.06em;text-transform:uppercase;margin:4px 0 6px}
.stop p{font-size:15px;color:var(--ink-soft)}
.stop .go,.stop .soon{display:inline-block;margin-top:8px;font:600 14px/1 var(--f-body)}
.stop .go{color:var(--maroon);text-decoration:none;border-bottom:1.5px solid currentColor;padding-bottom:2px}
.stop .go:hover{color:var(--ink)}
.go-cv{color:var(--maroon);font-weight:600;text-decoration:none;border-bottom:1.5px solid currentColor}
.go-cv:hover{color:var(--ink)}
.stop .go:focus-visible{outline:2px solid var(--maroon);outline-offset:3px}
.stop .soon{font:500 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);background:rgba(42,36,32,.07);padding:6px 8px;border-radius:3px}
.tram{position:absolute;left:12px;top:14px;width:24px;height:40px;border-radius:12px 12px 6px 6px;background:var(--ink);
  box-shadow:0 0 0 3px var(--cream);transition:top .55s cubic-bezier(.22,1,.36,1);pointer-events:none}
.tram::before{content:"";position:absolute;left:5px;right:5px;top:6px;height:9px;border-radius:5px 5px 2px 2px;background:var(--yellow)}
.tram::after{content:"";position:absolute;left:5px;right:5px;top:20px;height:12px;border-radius:2px;background:#f3d896;opacity:.85}
.route-key{display:flex;justify-content:space-between;font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);padding-left:60px}

/* ---------- top UI ---------- */
.nav{position:fixed;z-index:20;left:0;right:0;top:0;display:flex;justify-content:center;
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;pointer-events:auto;background:rgba(240,231,211,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:5px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.pills button{font:600 14px/1 var(--f-body);color:var(--ink);background:transparent;border:0;border-radius:999px;padding:9px 14px;cursor:pointer;letter-spacing:.02em}
.pills button:hover{background:rgba(122,30,37,.1)}
.pills button:focus-visible{outline:2px solid var(--maroon);outline-offset:1px}
.pills .mode{background:var(--maroon);color:var(--cream)}
.pills .mode:hover{background:var(--maroon-deep)}
.sep{width:1px;background:rgba(42,36,32,.18);margin:6px 2px}

/* ---------- sheets ---------- */
.stage{transition:filter .5s ease}
.stage.dim{filter:brightness(.9) saturate(.9)}
.veil{position:fixed;inset:0;z-index:30;background:rgba(20,16,14,0);transition:background .5s ease}
.veil.on{background:rgba(20,16,14,.24)}
.sheet{position:absolute;top:0;right:0;bottom:0;width:min(600px,100%);overflow:auto;overscroll-behavior:contain;background:var(--cream);color:var(--ink);
  box-shadow:-24px 0 60px rgba(0,0,0,.22);transform:translateX(40px);opacity:0;
  transition:transform .55s cubic-bezier(.22,1,.36,1),opacity .4s ease;outline:none}
.veil.on .sheet{transform:none;opacity:1}
.body>*{transition:opacity .45s ease,transform .55s cubic-bezier(.22,1,.36,1);opacity:0;transform:translateY(10px)}
.veil.on .body>*{opacity:1;transform:none}
.veil.on .body>*:nth-child(2){transition-delay:.06s}
.veil.on .body>*:nth-child(3){transition-delay:.12s}
.veil.on .body>*:nth-child(n+4){transition-delay:.18s}
.body.swap>*{opacity:0!important;transform:translateY(6px)!important;transition-delay:0s!important;transition-duration:.18s!important}
.sheet header{position:sticky;top:0;z-index:1;background:var(--maroon);color:var(--cream);padding:calc(22px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 18px 28px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.sheet header small{display:block;font:500 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;opacity:.75;margin-bottom:8px}
.sheet h3{margin:0;font:700 clamp(28px,5vw,40px)/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;text-wrap:balance}
.close{flex:none;font:600 14px/1 var(--f-body);background:var(--cream);color:var(--maroon);border:0;border-radius:999px;padding:9px 14px;cursor:pointer}
.close:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.body{padding:26px max(24px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) 28px;display:grid;gap:18px;font-size:16px;line-height:1.6}
.body p{margin:0;max-width:62ch}
.lede{font-size:18px}
.muted{color:var(--ink-soft)}

.tickets{display:grid;gap:12px}
.ticket{display:grid;grid-template-columns:72px 1fr;border:1.5px solid var(--ink);border-radius:4px;background:#f7f0e0;overflow:hidden;scroll-margin-top:110px}
.ticket .stub{background:var(--ink);color:var(--cream);display:grid;place-items:center;padding:10px 6px;font:500 13px/1.2 var(--f-mono);text-align:center;border-right:1.5px dashed var(--cream)}
.ticket .stub b{display:block;font:700 22px/1 var(--f-display);color:var(--yellow);margin-bottom:4px}
.ticket .info{padding:12px 16px;min-width:0}
.ticket h4{margin:0 0 4px;font:700 20px/1.15 var(--f-display);letter-spacing:.03em}
.ticket .meta{font:500 12px/1.4 var(--f-mono);color:var(--maroon);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.ticket p{font-size:15px}
.ticket.hl{box-shadow:0 0 0 3px var(--yellow)}

.tt{width:100%;border-collapse:collapse;font-size:15px}
.tt th{text-align:left;font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);padding:0 10px 10px 0;border-bottom:2px solid var(--ink)}
.tt td{padding:11px 10px 11px 0;border-bottom:1px solid rgba(42,36,32,.18);vertical-align:top}
.tt td:first-child{font:500 13px/1.5 var(--f-mono);white-space:nowrap;color:var(--maroon);font-variant-numeric:tabular-nums}
.tt td:last-child{color:var(--ink-soft)}
.wrap-x{overflow-x:auto}

.mail{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mail code{font:500 18px/1.2 var(--f-mono);background:#f7f0e0;border:1.5px solid var(--ink);padding:10px 14px;border-radius:4px;user-select:all;word-break:break-all}
.btn{font:600 15px/1 var(--f-body);background:var(--maroon);color:var(--cream);border:0;border-radius:999px;padding:12px 18px;cursor:pointer}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.note{font:500 12px/1.5 var(--f-mono);color:var(--ink-soft)}

@media (max-width:520px){
  .ticket{grid-template-columns:58px 1fr}
  .pills button{padding:7px 8px;font-size:12.5px}
  .sep{display:none}
}
@media (prefers-reduced-motion:reduce){
  .drift,.puff{animation:none!important}
  .tram{transition:none}
  .veil,.sheet,.body>*,.stage{transition:none!important}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="scene" id="scene" data-mode="day">
    <svg class="world" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color:var(--sky1)"/>
          <stop offset=".55" style="stop-color:var(--sky2)"/>
          <stop offset="1" style="stop-color:var(--sky3)"/>
        </linearGradient>
        <radialGradient id="glow">
          <stop offset="0" stop-color="#ffd98a" stop-opacity=".75"/>
          <stop offset=".45" stop-color="#ffc861" stop-opacity=".22"/>
          <stop offset="1" stop-color="#ffc861" stop-opacity="0"/>
        </radialGradient>
        <!-- arched sash window pair -->
        <g id="win">
          <path d="M0 0 h86 v126 h-86 z" style="fill:var(--stone-l)"/>
          <path d="M10 118 v-82 a15 15 0 0 1 30 0 v82 z" style="fill:var(--glass)"/>
          <path d="M46 118 v-82 a15 15 0 0 1 30 0 v82 z" style="fill:var(--glass)"/>
          <path d="M14 70 h22 M50 70 h22" style="stroke:var(--stone-l)" stroke-width="3"/>
          <rect x="-6" y="126" width="98" height="10" style="fill:var(--stone-l)"/>
        </g>
        <!-- lamp post -->
        <g id="lamp">
          <circle cx="0" cy="-238" r="70" fill="url(#glow)" style="opacity:var(--glow)"/>
          <rect x="-4" y="-215" width="8" height="215" style="fill:var(--maroon)"/>
          <rect x="-9" y="-20" width="18" height="20" style="fill:var(--maroon-deep)"/>
          <path d="M-18 -215 h36 l-4 -36 h-28 z" style="fill:var(--lamp-glass)"/>
          <path d="M-22 -251 h44 l-22 -16 z" style="fill:var(--maroon-deep)"/>
          <path d="M-16 -215 h32 v6 h-32z" style="fill:var(--maroon-deep)"/>
          <circle cx="0" cy="-271" r="4" style="fill:var(--maroon-deep)"/>
        </g>
        <!-- bench -->
        <g id="bench">
          <rect x="0" y="0" width="110" height="10" rx="2" style="fill:var(--stone-l)"/>
          <rect x="0" y="16" width="110" height="7" rx="2" style="fill:var(--stone-l)"/>
          <rect x="0" y="30" width="110" height="9" rx="2" style="fill:var(--stone-l)"/>
          <path d="M8 -2 v54 M102 -2 v54 M8 39 l-6 14 M102 39 l6 14" stroke="#2c2622" stroke-width="7" stroke-linecap="round"/>
        </g>
        <g id="wild">
          <path d="M-14 0 q-2 -14 -6 -24 M-4 0 q0 -16 2 -30 M6 0 q3 -12 8 -20 M14 0 q1 -10 -1 -16 M-22 0 q-4 -8 -10 -12" fill="none" stroke="#5b7a3a" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M-8 -6 q-6 -8 -12 -6 M8 -4 q8 -6 12 -2" fill="none" stroke="#5b7a3a" stroke-width="2.6" stroke-linecap="round"/>
          <g fill="#f4efe2"><circle cx="-23" cy="-26" r="3.2"/><circle cx="-17" cy="-26" r="3.2"/><circle cx="-20" cy="-30" r="3.2"/><circle cx="-20" cy="-22" r="3.2"/></g>
          <circle cx="-20" cy="-26" r="2" fill="#e2b93f"/>
          <circle cx="-2" cy="-32" r="4" fill="#e2b93f"/><circle cx="-2" cy="-32" r="1.6" fill="#a86f1f"/>
          <circle cx="14" cy="-22" r="3.4" fill="#c97aa8"/><circle cx="13" cy="-17" r="2.6" fill="#9a6bb3"/>
          <circle cx="-32" cy="-13" r="2.8" fill="#e2b93f"/>
        </g>
      </defs>

      <!-- sky -->
      <g class="layer" data-depth="0">
        <rect x="-300" y="-200" width="2200" height="1200" fill="url(#sky)"/>
        <g style="opacity:var(--stars)" fill="#f4ecd6">
          <circle cx="120" cy="70" r="1.6"/><circle cx="260" cy="140" r="1.2"/><circle cx="410" cy="60" r="1.8"/><circle cx="560" cy="180" r="1.1"/>
          <circle cx="700" cy="90" r="1.5"/><circle cx="860" cy="40" r="1.2"/><circle cx="1010" cy="130" r="1.7"/><circle cx="1180" cy="70" r="1.3"/>
          <circle cx="1320" cy="160" r="1.1"/><circle cx="1460" cy="50" r="1.6"/><circle cx="1540" cy="200" r="1.2"/><circle cx="330" cy="230" r="1"/>
          <circle cx="1240" cy="18" r="22" fill="#efe3c2"/>
        </g>
      </g>
      <!-- clouds: poster bands, drawn twice for a seamless drift -->
      <g class="layer" data-depth="0.15">
        <g class="drift">
          <g id="cloudset">
            <path d="M-40 150 q120 -70 260 -20 q90 -50 210 0 q80 -20 140 20 z" style="fill:var(--cloud)"/>
            <path d="M380 250 q140 -55 300 -10 q100 -40 220 10 z" style="fill:var(--cloud2)"/>
            <path d="M820 120 q160 -80 330 -12 q110 -45 230 8 q70 -10 120 4 z" style="fill:var(--cloud)"/>
            <path d="M1180 270 q120 -40 260 -6 q70 -26 200 6 z" style="fill:var(--cloud2)"/>
            <path d="M120 320 q140 -30 300 -4 h-300z" style="fill:var(--cloud2)"/>
          </g>
          <use href="#cloudset" x="1600"/>
        </g>
      </g>
      <!-- fells -->
      <g class="layer" data-depth="0.35">
        <path d="M-200 520 L-200 430 Q 80 360 300 410 Q 520 350 760 400 Q 980 330 1220 395 Q 1460 350 1800 420 L1800 520 Z" style="fill:var(--fell-far)"/>
      </g>
      <g class="layer" data-depth="0.55">
        <path d="M-200 560 L-200 470 Q 120 420 380 470 Q 640 430 880 468 Q 1100 440 1300 470 Q 1560 440 1800 480 L1800 560 Z" style="fill:var(--fell-mid)"/>

  }

  /* ---------- cloud shadows: tileable value noise, scrolled ---------- */
  const cvs = document.getElementById('shadows'), ctx = cvs.getContext('2d');
  const T = 192, tile = document.createElement('canvas'); tile.width = T; tile.height = T;
  (function makeTile() {
    const tctx = tile.getContext('2d'), img = tctx.createImageData(T, T);
    const rnd = (i, j, p) => { const a = ((i % p) + p) % p, b = ((j % p) + p) % p; const s = Math.sin(a * 127.1 + b * 311.7 + p * 17.3) * 43758.5453; return s - Math.floor(s); };
    const sm = t => t * t * (3 - 2 * t);
    const vnoise = (x, y, p) => { const i = Math.floor(x), j = Math.floor(y), fx = sm(x - i), fy = sm(y - j);
      const a = rnd(i, j, p), b = rnd(i + 1, j, p), c = rnd(i, j + 1, p), d = rnd(i + 1, j + 1, p);
      return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy; };
    for (let y = 0; y < T; y++) for (let x = 0; x < T; x++) {
      let n = 0, amp = .5, p = 3;
      for (let o = 0; o < 4; o++) { n += amp * vnoise(x / T * p, y / T * p, p); amp *= .5; p *= 2; }
      const t = Math.min(1, Math.max(0, (n - .48) / .14));
      const a = t * t * (3 - 2 * t) * 0.42;
      const k = (y * T + x) * 4; img.data[k] = 58; img.data[k + 1] = 62; img.data[k + 2] = 78; img.data[k + 3] = a * 255;
    }
    tctx.putImageData(img, 0, 0);
  })();
  function sizeCanvas() { cvs.width = Math.max(2, Math.round(scene.clientWidth / 3)); cvs.height = Math.max(2, Math.round(scene.clientHeight / 3)); drawShadows(); }
  let off = 0;
  function drawShadows() {
    const w = cvs.width * 1.1, h = cvs.height * 1.6;
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    ctx.imageSmoothingQuality = 'high';
    const o = -(off % w);
    for (let x = o - w; x < cvs.width + w; x += w) ctx.drawImage(tile, x, -cvs.height * .3, w, h);
  }

  let last = 0;
  function loop(t) {
    if (!reduce && t - last > 40) { off += cvs.width * 0.0006; drawShadows(); last = t; }

  /* ---------- departure board ---------- */

  const CH = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+/';
  const cells = (txt, len, cls = '') => `<span class="cells ${cls}">${[...txt.padEnd(len)].map(ch => `<span class="c" data-t="${ch}"> </span>`).join('')}</span>`;
  rowsEl.innerHTML = works.map(w => `<button class="row" data-open="works" data-target="${w.id}" aria-label="${w.n.toLowerCase()}, ${w.t.toLowerCase()}, ${w.y}">${cells(w.y, 5)}${cells(w.n, 12)}${cells(w.t, 5, 'type')}</button>`).join('');
  function flapAll() {
    rowsEl.querySelectorAll('.c').forEach((c, i) => {
      const target = c.dataset.t;
      if (reduce) { c.textContent = target; return; }
      let n = 0; const steps = 4 + Math.floor(Math.random() * 10);
      setTimeout(() => {
        const iv = setInterval(() => {
          c.textContent = n >= steps ? target : CH[Math.floor(Math.random() * CH.length)];
          c.classList.remove('flip'); void c.offsetWidth; c.classList.add('flip');
          if (n++ >= steps) clearInterval(iv);
        }, 60);
      }, (i % 21) * 35 + Math.floor(i / 21) * 140);
    });
  }
  const clock = document.getElementById('clock');
  const tick = () => { const d = new Date(); clock.textContent = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); };
  tick(); setInterval(tick, 20000);

  /* ---------- heritage train (BR Mk1 proportions) ---------- */
  const tm = document.getElementById('train-move');
  const mk = (tag, a, parent, text) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (text) e.textContent = text; (parent || tm).appendChild(e); return e; };
  function bogie(g, x) {
    mk('rect', { x: x - 34, y: 122, width: 68, height: 10, rx: 3, fill: '#1c1918' }, g);
    for (const dx of [-20, 20]) { mk('circle', { cx: x + dx, cy: 136, r: 12, fill: '#2a2624' }, g); mk('circle', { cx: x + dx, cy: 136, r: 3.5, fill: '#7d7770' }, g); }
  }
  // steam locomotive, facing left
  (() => {
    const g = mk('g', {});
    // tender
    mk('rect', { x: 300, y: 36, width: 130, height: 86, rx: 6, fill: '#1e1b1a' }, g);
    mk('rect', { x: 306, y: 50, width: 118, height: 3, fill: '#c8a65a' }, g);
    // cab
    mk('path', { d: 'M226 16 H306 V122 H226 Z', fill: '#1e1b1a' }, g);
    mk('path', { d: 'M220 16 Q266 2 312 16 V22 H220 Z', fill: '#121010' }, g);
    mk('rect', { x: 240, y: 32, width: 26, height: 26, rx: 4, style: 'fill:var(--glass)' }, g);
    // boiler
    mk('rect', { x: 44, y: 46, width: 186, height: 56, rx: 10, fill: '#1e1b1a' }, g);
    mk('rect', { x: 44, y: 40, width: 46, height: 68, rx: 8, fill: '#121010' }, g); // smokebox
    mk('rect', { x: 60, y: 14, width: 18, height: 30, rx: 2, fill: '#121010' }, g);  // chimney
    mk('rect', { x: 56, y: 12, width: 26, height: 6, rx: 2, fill: '#121010' }, g);
    mk('path', { d: 'M136 46 q0 -18 16 -18 q16 0 16 18 z', fill: '#121010' }, g);   // dome
    mk('path', { d: 'M98 74 H228', stroke: '#c8a65a', 'stroke-width': 2 }, g);
    // running board + buffer beam
    mk('rect', { x: 30, y: 102, width: 276, height: 8, fill: '#121010' }, g);
    mk('rect', { x: 20, y: 104, width: 26, height: 18, fill: '#b3201f' }, g);
    mk('rect', { x: 10, y: 108, width: 12, height: 6, rx: 2, fill: '#121010' }, g);
    mk('circle', { cx: 50, cy: 88, r: 5, fill: '#f6eccb' }, g);
    // driving wheels + rods
    for (const x of [116, 170, 224]) { mk('circle', { cx: x, cy: 124, r: 24, fill: '#7a1e25' }, g); mk('circle', { cx: x, cy: 124, r: 6, fill: '#1e1b1a' }, g); }
    mk('circle', { cx: 66, cy: 136, r: 12, fill: '#2a2624' }, g);
    mk('path', { d: 'M116 128 H224', stroke: '#9b958d', 'stroke-width': 5, 'stroke-linecap': 'round' }, g);
    for (const x of [340, 392]) { mk('circle', { cx: x, cy: 136, r: 12, fill: '#2a2624' }, g); }
    // steam puffs
    const p = mk('g', {}, g);
    for (let i = 0; i < 3; i++) mk('circle', { class: 'puff', cx: 69, cy: 4, r: 14, style: 'fill:var(--steam)' }, p);
  })();
  // three maroon coaches
  const COACH = 520, START = 442;
  for (let i = 0; i < 3; i++) {
    const g = mk('g', { transform: `translate(${START + i * (COACH + 10)} 0)` });
    mk('rect', { x: -10, y: 30, width: 10, height: 80, fill: '#1c1918' }, g); // gangway
    mk('path', { d: `M0 16 Q2 4 22 2 H${COACH - 22} Q${COACH - 2} 4 ${COACH} 16 Z`, style: 'fill:var(--coach-roof)' }, g);
    mk('rect', { x: 0, y: 14, width: COACH, height: 108, rx: 6, style: 'fill:var(--maroon)' }, g);
    mk('path', { d: `M0 30 H${COACH} M0 76 H${COACH}`, stroke: '#d4b16a', 'stroke-width': 1.6, opacity: .9 }, g);
    // doors at each end with droplights
    for (const dx of [16, COACH - 46]) {
      mk('rect', { x: dx, y: 20, width: 30, height: 98, rx: 2, fill: 'none', stroke: '#4d1216', 'stroke-width': 2 }, g);
      mk('rect', { x: dx + 6, y: 34, width: 18, height: 30, rx: 3, style: 'fill:var(--glass)' }, g);
      mk('rect', { x: dx + 22, y: 78, width: 3, height: 10, fill: '#d4b16a' }, g);
    }
    // compartment windows
    const n = 7, w = 46, gap = (COACH - 92 - 24 - n * w) / (n - 1);
    for (let k = 0; k < n; k++) mk('rect', { x: 58 + k * (w + gap), y: 36, width: w, height: 34, rx: 5, style: 'fill:var(--glass)' }, g);
    mk('rect', { x: 0, y: 112, width: COACH, height: 10, fill: '#1c1918' }, g);
    bogie(g, 90); bogie(g, COACH - 90);
  }
  const TRAIN_LEN = START + 3 * (COACH + 10);

  /* train calls at the platform while Works is open */
  let trainState = 'away', trainAnim = null;
  const AWAY_RIGHT = 1900, AWAY_LEFT = -(TRAIN_LEN + 300);
  const currentX = () => { const m = new DOMMatrixReadOnly(getComputedStyle(tm).transform); return m.m41 || 0; };
  tm.style.transform = `translateX(${AWAY_RIGHT}px)`;
  function runTrain(from, to, ms, easing, then) {
    if (trainAnim) trainAnim.cancel();
    tm.style.transform = `translateX(${to}px)`;
    if (reduce) { then && then(); return; }
    scene.classList.add('go', 'leaving');
    trainAnim = tm.animate([{ transform: `translateX(${from}px)` }, { transform: `translateX(${to}px)` }], { duration: ms, easing });
    trainAnim.onfinish = () => { trainAnim = null; scene.classList.remove('go', 'leaving'); then && then(); };
  }
  function trainArrive() {
    if (trainState === 'in' || trainState === 'arriving') return;
    const from = trainState === 'leaving' ? currentX() : AWAY_RIGHT;
    trainState = 'arriving';
    const dist = Math.abs(from);
    runTrain(from, 0, Math.max(1400, Math.min(3200, dist * 1.7)), 'cubic-bezier(.15,.6,.25,1)', () => { trainState = 'in'; });
  }
  function trainDepart() {
    if (trainState === 'away' || trainState === 'leaving') return;
    const from = trainState === 'arriving' ? currentX() : 0;
    trainState = 'leaving';
    runTrain(from, AWAY_LEFT, 4200, 'cubic-bezier(.55,0,.8,.3)', () => { trainState = 'away'; tm.style.transform = `translateX(${AWAY_RIGHT}px)`; });
  }

  /* ---------- day / night ---------- */
  const modeBtn = document.getElementById('mode');
  function setMode(m) {
    scene.dataset.mode = m;
    modeBtn.textContent = m === 'night' ? 'Day' : 'Night';
    modeBtn.setAttribute('aria-pressed', m === 'night');
    try { localStorage.setItem('station-mode', m); } catch (e) {}
  }
  let saved = null; try { saved = localStorage.getItem('station-mode'); } catch (e) {}
  const rootTheme = document.documentElement.dataset.theme;
  setMode(saved || (rootTheme ? (rootTheme === 'dark' ? 'night' : 'day') : (matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day')));
  modeBtn.addEventListener('click', () => setMode(scene.dataset.mode === 'night' ? 'day' : 'night'));

  /* ---------- sheets ---------- */
  const veil = document.getElementById('veil'), sheet = document.getElementById('sheet');
  const kicker = document.getElementById('sheet-kicker'), title = document.getElementById('sheet-title'), body = document.getElementById('sheet-body');
  const meta = {
    works: ['Platform 1 · Calling at', 'Works'],
    about: ['Way out · Station office', 'About'],
    contact: ['Royal Mail · Last post 17:30', 'Contact'],
    cv: ['Timetable · Valid from 2022', 'CV'],
  };
  let current = null, opener = null, hideTimer = 0;
  function fill(key, target) {
    current = key;
    kicker.textContent = meta[key][0]; title.textContent = meta[key][1];
    body.replaceChildren(document.getElementById('t-' + key).content.cloneNode(true));
    if (key === 'contact') wireCopy();
    if (key === 'works') { wireRoute(target); trainArrive(); } else trainDepart();
    sheet.scrollTop = 0;
    if (target) {
      const el = document.getElementById(target);
      if (el) setTimeout(() => el.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' }), reduce ? 0 : 320);
    }
  }
  function open(key, target) {
    clearTimeout(hideTimer);
    if (!veil.hidden && veil.classList.contains('on')) {
      if (key === current && !target) return;
      body.classList.add('swap');
      setTimeout(() => { fill(key, target); requestAnimationFrame(() => body.classList.remove('swap')); }, reduce ? 0 : 180);
      return;
    }
    opener = document.activeElement;
    fill(key, target);
    veil.hidden = false;
    stage.classList.add('dim');
    requestAnimationFrame(() => requestAnimationFrame(() => { veil.classList.add('on'); sheet.focus({ preventScroll: true }); }));
  }
  function close() {
    if (veil.hidden || !veil.classList.contains('on')) return;
    veil.classList.remove('on');
    trainDepart();
    stage.classList.remove('dim');
    hideTimer = setTimeout(() => { veil.hidden = true; current = null; }, reduce ? 0 : 520);
    if (opener && opener.focus) opener.focus({ preventScroll: true });
  }
  function wireRoute(target) {
    const route = document.getElementById('route'), tram = document.getElementById('tram');
    const stops = [...route.querySelectorAll('.stop')];
    let pinned = stops.find(s => s.id === target) || stops[0];
    const moveTo = st => { stops.forEach(s => s.classList.toggle('on', s === st)); tram.style.top = (st.offsetTop + 8) + 'px'; };
    stops.forEach(st => {
      st.addEventListener('pointerenter', () => moveTo(st));
      st.addEventListener('focus', () => { pinned = st; moveTo(st); });
      st.addEventListener('click', () => { pinned = st; moveTo(st); });
    });
    route.addEventListener('pointerleave', () => moveTo(pinned));
    requestAnimationFrame(() => moveTo(pinned));
  }
  function wireCopy() {
    const btn = document.getElementById('copy'), addr = document.getElementById('addr'), msg = document.getElementById('copied');
    btn.addEventListener('click', () => {
      const text = addr.textContent;
      const selectIt = () => { const r = document.createRange(); r.selectNodeContents(addr); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent = 'Address selected. Press Ctrl+C or ⌘C to copy.'; };
      try {
        navigator.clipboard.writeText(text).then(() => { msg.textContent = 'Copied to clipboard'; }, selectIt);
      } catch (e) { selectIt(); }
    });
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-open]');
    if (b) open(b.dataset.open, b.dataset.target);
  });
  document.getElementById('close').addEventListener('click', close);
  veil.addEventListener('click', e => { if (e.target === veil) close(); });
  addEventListener('keydown', e => {
    if (e.key === 'Escape') close();
    if (e.key === 'Tab' && !veil.hidden) {
      const f = [...sheet.querySelectorAll('button, [href], [tabindex]:not([tabindex="-1"])')];
      if (!f.length) return;
      const first = f[0], lastEl = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); lastEl.focus(); }
      else if (!e.shiftKey && document.activeElement === lastEl) { e.preventDefault(); first.focus(); }
    }
  });

  /* ---------- boot ---------- */
  addEventListener('resize', resize);
  resize();
  if (stage.scrollWidth > stage.clientWidth) stage.scrollLeft = scene.clientWidth * 0.03;
  flapAll();
  const fromHash = () => {
    const h = location.hash.slice(1);
    const map = { about: 'about', projects: 'works', research: 'works', works: 'works', contact: 'contact', cv: 'cv' };
    if (map[h]) open(map[h]);
  };
  fromHash(); addEventListener('hashchange', fromHash);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
